services:
  postgres:
    container_name: conference_db
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - conference_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conference_net

  redis:
    container_name: conference_redis
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conference_net

  django:
    container_name: conference_django
    build: ./django_admin
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conference_net

  fastapi:
    container_name: conference_fastapi
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conference_net

  nginx:
    container_name: conference_nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - static_files:/static:ro
    depends_on:
      - django
      - fastapi
    networks:
      - conference_net

volumes:
  conference_data:
  static_files:

networks:
  conference_net:
    driver: bridge